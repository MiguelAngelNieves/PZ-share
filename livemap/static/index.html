<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12150F">
<title>PZ Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { color-scheme:dark;
  --bg:#12150F; --surface:#1C2119; --sheet:#1A1F17; --chip:#2A3224; --border:#2E3628; --border2:#3A4431;
  --text:#ECE9DD; --muted:#A9A894; --dim:#8F8E7C; --accent:#E8A33D; --accent2:#F4C37A; --teal:#6CC4B6;
  --danger:#E58B7B; --danger-bg:#3A221E; --danger-bd:#5A2F28; --float:rgba(28,33,25,.94);
  --shadow:0 4px 16px rgba(0,0,0,.35); --display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h:68px; --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 var(--body); }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--accent); }
.hidden { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.display { font-family:var(--display); font-weight:700; letter-spacing:.02em; }
.muted { color:var(--muted); }

/* ── estructura ── */
#app { position:fixed; inset:0; display:flex; }
#mapwrap { position:relative; flex:1; min-width:0; }
#map { position:absolute; inset:0; background:#0b0e0c; }
.leaflet-container { background:#0b0e0c; font:inherit; }
#side { display:flex; flex-direction:column; background:var(--bg); }
#side .scroll { flex:1; overflow:auto; padding:0 16px 24px; }
.side-head { padding:20px 20px 12px; display:flex; flex-direction:column; gap:2px; }
.side-head h1 { margin:0; font:700 34px/1 var(--display); letter-spacing:.02em; text-transform:uppercase; }
.side-head .sub { font-size:13px; color:var(--muted); font-weight:600; }

/* ── barra superior flotante ── */
.topbar { position:absolute; z-index:1000; top:calc(12px + env(safe-area-inset-top, 0px)); left:12px; right:12px;
  display:flex; align-items:center; gap:12px; padding:10px 14px 10px 18px; background:var(--float);
  border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); }
.topbar .when { font:700 24px/1.05 var(--display); letter-spacing:.02em; }
.topbar .who { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .grow { flex:1; min-width:0; display:flex; flex-direction:column; }
.live { display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:12px; background:#1F3330;
  color:#9EDDD3; font-size:11px; font-weight:800; white-space:nowrap; }
.live i { width:7px; height:7px; border-radius:50%; background:var(--teal); }
.live.off { background:var(--chip); color:var(--muted); } .live.off i { background:var(--dim); }

.chips { position:absolute; z-index:1000; top:calc(86px + env(safe-area-inset-top, 0px)); left:12px; right:68px;
  display:flex; gap:8px; flex-wrap:wrap; }
.chipbtn { min-height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--border); background:var(--float);
  font-size:13px; font-weight:600; box-shadow:var(--shadow); }
.chipbtn[aria-pressed="true"] { background:var(--accent); color:#12150F; border-color:var(--accent); font-weight:800; }

.tools { position:absolute; z-index:1000; top:calc(86px + env(safe-area-inset-top, 0px)); right:12px; display:flex;
  flex-direction:column; gap:8px; }
.round { width:48px; height:48px; border-radius:50%; border:1px solid var(--border); background:var(--float);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
.round[aria-pressed="true"] { color:var(--accent); border-color:var(--accent); }
.round svg, .ico { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

.fab { position:absolute; z-index:1000; right:16px; bottom:calc(var(--sheet-h, 220px) + 16px);
  height:56px; padding:0 22px 0 18px; border-radius:18px; border:0; background:var(--accent); color:#12150F;
  display:flex; align-items:center; gap:8px; font:700 21px var(--display); letter-spacing:.04em;
  box-shadow:0 6px 18px rgba(0,0,0,.45); }
.fab.armed { background:#ECE9DD; }
.banner { position:absolute; z-index:1001; left:50%; transform:translateX(-50%); top:calc(140px + env(safe-area-inset-top, 0px));
  padding:10px 12px 10px 16px; border-radius:16px; background:var(--accent); color:#12150F; font-weight:800;
  display:flex; gap:12px; align-items:center; box-shadow:var(--shadow); white-space:nowrap; }
.banner button { border:0; background:#12150F; color:var(--text); border-radius:10px; min-height:36px; padding:0 12px; font-weight:700; }

/* ── hoja inferior (celular, vista Mapa) ── */
.sheet { position:absolute; z-index:1000; left:0; right:0; bottom:0; background:var(--sheet);
  border-top:1px solid var(--border); border-radius:22px 22px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.4);
  padding:10px 0 calc(var(--nav-h) + var(--safe-b)); }
.sheet .handle { width:40px; height:4px; border-radius:2px; background:var(--border2); margin:0 auto 12px; }
.mini { display:grid; grid-auto-flow:column; grid-auto-columns:calc(50% - 21px); gap:10px; padding:0 16px 14px;
  overflow-x:auto; scrollbar-width:none; }
.mini .card { padding:12px; border-radius:16px; background:#232A1F; display:flex; flex-direction:column; gap:8px;
  border:1px solid transparent; text-align:left; }
.mini .card.hurt { background:#2C201C; }
.mini .card.sel { border-color:var(--accent); }
.mini .card.off { opacity:.55; }
.mini .nm { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; }
.mini .nm i { width:10px; height:10px; border-radius:50%; flex:none; }
.mini .big { font:700 32px/1 var(--display); }
.mini .big small { font:600 12px var(--body); color:var(--muted); }
.mini .st { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.empty { color:var(--muted); font-size:13px; padding:8px 4px; }

/* ── menú inferior ── */
nav.tabs { position:fixed; z-index:1100; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(5, minmax(0,1fr));
  background:var(--sheet); border-top:1px solid var(--border); padding:6px 4px calc(10px + var(--safe-b)); }
nav.tabs button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:4px;
  min-height:48px; font-size:11px; font-weight:600; color:var(--muted); }
nav.tabs button[aria-current="page"] { color:var(--accent); font-weight:800; }

/* ── tarjetas ── */
.card2 { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px;
  display:flex; flex-direction:column; gap:12px; margin-bottom:12px; }
.card2.hurt { border-color:var(--danger-bd); }
.card2.off { opacity:.6; }
.prow { display:flex; align-items:center; gap:12px; }
.avatar { width:44px; height:44px; border-radius:50%; color:#12150F; display:flex; align-items:center; justify-content:center;
  font:700 20px var(--display); flex:none; }
.prow .nm { flex:1; min-width:0; display:flex; flex-direction:column; }
.prow .nm b { font-size:16px; font-weight:800; }
.prow .nm span { font-size:12px; color:var(--muted); }
.hpnum { display:flex; flex-direction:column; align-items:flex-end; }
.hpnum b { font:700 32px/1 var(--display); }
.hpnum span { font-size:11px; color:var(--muted); }
.bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
.bar > i { display:block; height:100%; border-radius:4px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; font-size:12px; font-weight:600; }
.tag { padding:5px 10px; border-radius:12px; background:var(--chip); }
.tag.bad { background:var(--danger-bg); color:#F2C2B8; }
.tag.soft { color:#C9C7B5; }
h2.sec { margin:4px 0 10px; font:700 22px var(--display); letter-spacing:.03em; text-transform:uppercase; }

/* tareas */
.task { display:flex; align-items:center; gap:12px; min-height:48px; border-top:1px solid var(--chip); font-size:14px; }
.task:first-of-type { border-top:0; }
.task input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); flex:none; }
.task .tx { flex:1; min-width:0; }
.task.done .tx { color:var(--dim); text-decoration:line-through; }
.task .by { font-size:11px; color:var(--muted); display:inline-block; width:100%; text-decoration:none; }
.ini { width:24px; height:24px; border-radius:50%; color:#12150F; font-size:11px; font-weight:800; display:flex;
  align-items:center; justify-content:center; flex:none; }
.x { width:36px; height:36px; border-radius:10px; border:0; background:none; color:var(--dim); flex:none; }
.x:hover { color:var(--danger); background:var(--danger-bg); }
.addrow { display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--chip); }
.addrow input { flex:1; min-width:0; min-height:44px; border:1px solid var(--border2); border-radius:12px; padding:0 12px; background:var(--bg); }
.addrow input::placeholder { color:var(--dim); }
.addrow button, .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 14px; border-radius:12px; border:0; background:var(--accent); color:#12150F; font-weight:800; }
.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border2); font-weight:700; }

/* álbum */
.seg { display:flex; border:1px solid var(--border); border-radius:14px; overflow:hidden; font-size:13px; }
.seg button { min-height:40px; padding:0 12px; border:0; background:transparent; font-weight:600; }
.seg button[aria-pressed="true"] { background:var(--text); color:#12150F; font-weight:800; }
.hint { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--surface);
  border:1px solid var(--border); font-size:12px; color:#C9C7B5; margin-bottom:14px; }
.day { font:700 18px var(--display); letter-spacing:.04em; color:var(--muted); margin:6px 0 8px; }
.photos { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-bottom:12px; }
.photo { margin:0; border:0; padding:0; background:none; text-align:left; display:flex; flex-direction:column; gap:6px; }
.photo img { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:14px; background:var(--chip); display:block; }
.photo span { font-size:12px; line-height:1.35; }
.photo span em { font-style:normal; color:var(--muted); }

/* logros */
.totals { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; margin-bottom:12px; }
.totals div { padding:10px 6px; border-radius:14px; background:var(--surface); border:1px solid var(--border); text-align:center; }
.totals b { display:block; font:700 28px/1 var(--display); }
.totals span { font-size:11px; color:var(--muted); }
.rec { display:flex; justify-content:space-between; gap:10px; align-items:center; min-height:42px; border-top:1px solid var(--chip); font-size:13px; }
.rec:first-of-type { border-top:0; }
.achs { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:12px; }
.ach { padding:12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; gap:5px; }
.ach b { font-size:13px; font-weight:800; }
.ach span { font-size:12px; color:var(--muted); }
.ach.done { background:#2A2415; border-color:#5C4A22; }
.ach.done b { color:var(--accent2); } .ach.done span { color:#C9C7B5; }
.ach .bar { height:5px; }
.log { font-size:13px; line-height:1.45; padding:4px 0; display:grid; grid-template-columns:78px 1fr; gap:6px; }
.log time { color:var(--dim); font-variant-numeric:tabular-nums; }
.leaflet-tooltip, .leaflet-tooltip.tip { background:rgba(18,21,15,.94); color:var(--text); border:1px solid var(--border2); border-radius:10px;
  font:700 12px var(--body); box-shadow:var(--shadow); padding:4px 8px; }
.leaflet-tooltip-top:before, .leaflet-tooltip-right:before, .leaflet-tooltip-left:before, .leaflet-tooltip-bottom:before { display:none; }
.log.k-death { color:#F2C2B8; }

/* marcadores del mapa */
.pin { width:36px; height:36px; border-radius:50%; border:3px solid #12150F; display:flex; align-items:center; justify-content:center;
  font:700 18px var(--display); color:#12150F; box-shadow:0 2px 10px rgba(0,0,0,.5); }
.pin.off { filter:grayscale(1); opacity:.55; }
.pin.dead { background:#5a5a52 !important; color:var(--text); }
.pinlabel { position:absolute; left:50%; top:40px; transform:translateX(-50%); white-space:nowrap; background:rgba(18,21,15,.88);
  padding:2px 8px; border-radius:8px; font-size:12px; font-weight:700; }
.mark { display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 5px; background:rgba(28,33,25,.96);
  border:1px solid var(--border2); border-radius:16px; font-size:12px; font-weight:700; white-space:nowrap; transform:translate(-14px,-14px); }
.mark span { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--border); }
.mark span svg { width:14px; height:14px; fill:none; stroke:var(--text); stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
.mark.base span { background:var(--text); } .mark.base span svg { stroke:#12150F; }
.mark.peligro span { background:var(--danger-bg); } .mark.peligro span svg { stroke:var(--danger); }
.mark.loot span { background:#2A2415; } .mark.loot span svg { stroke:var(--accent); }
.ping { position:relative; width:0; height:0; }
.ping .ring { position:absolute; left:-20px; top:-20px; width:40px; height:40px; border-radius:50%; border:2px solid var(--accent);
  animation:ring 1.6s ease-out infinite; }
.ping .bubble { position:absolute; left:14px; top:-54px; padding:8px 12px; background:var(--accent); color:#12150F;
  border-radius:14px 14px 14px 4px; font-size:12px; line-height:1.35; white-space:nowrap; box-shadow:var(--shadow); }
@keyframes ring { from { transform:scale(.4); opacity:1 } to { transform:scale(1.6); opacity:0 } }
.town { color:#cfd8d3; font:700 15px var(--display); text-shadow:0 1px 3px #000; white-space:nowrap; letter-spacing:.08em;
  text-transform:uppercase; transform:translate(-50%,-50%); }
.photomark img { width:40px; height:40px; object-fit:cover; border-radius:10px; border:2px solid var(--text); box-shadow:var(--shadow); }

/* timelapse */
.tl { position:absolute; z-index:1001; left:0; right:0; bottom:0; background:var(--sheet); border-top:1px solid var(--border);
  border-radius:22px 22px 0 0; padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 14px); display:flex; flex-direction:column; gap:14px; }
.tl .row { display:flex; align-items:center; gap:14px; }
.tl .play { width:56px; height:56px; border-radius:50%; border:0; background:var(--accent); color:#12150F; display:flex; align-items:center; justify-content:center; flex:none; }
.tl input[type=range] { width:100%; accent-color:var(--accent); }
.tl .speeds { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); font-weight:600; }
.tl .speeds button { min-height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--border2); background:transparent; font-size:13px; font-weight:700; }
.tl .speeds button[aria-pressed="true"] { background:var(--text); color:#12150F; border-color:var(--text); }
.tl .cap { padding:10px 12px; border-radius:14px; background:#232A1F; font-size:13px; line-height:1.4; min-height:40px; }

/* modales */
.modal { position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; }
.modal .box { width:min(480px, 100%); background:var(--surface); border:1px solid var(--border); border-radius:22px 22px 0 0;
  padding:20px 20px calc(20px + var(--safe-b)); display:flex; flex-direction:column; gap:12px; }
.modal h3 { margin:0; font:700 24px var(--display); letter-spacing:.02em; }
.modal input[type=text] { min-height:44px; border:1px solid var(--border2); border-radius:12px; padding:0 12px; background:var(--bg); }
.kinds { display:flex; flex-wrap:wrap; gap:8px; }
.kinds button { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 12px; border-radius:20px; border:1px solid var(--border2); background:transparent; font-weight:700; }
.kinds button[aria-pressed="true"] { background:var(--accent); color:#12150F; border-color:var(--accent); }
.modal .acts { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.lightbox .box { width:min(960px, 100%); border-radius:22px; margin:16px; }
.lightbox img { width:100%; max-height:70vh; object-fit:contain; border-radius:14px; background:#000; }
@media (min-width: 900px) { .modal { align-items:center; } .modal .box { border-radius:22px; } }

.leaflet-control-zoom { display:none; }

/* ── celular ── */
@media (max-width: 899px) {
  #side { position:fixed; z-index:1050; inset:0; bottom:calc(var(--nav-h) + var(--safe-b)); padding-top:env(safe-area-inset-top, 0px); }
  body[data-tab="mapa"] #side { display:none; }
  body:not([data-tab="mapa"]) .onmap { display:none !important; }
  .desk { display:none !important; }
}
/* ── PC ── */
@media (min-width: 900px) {
  :root { --nav-h:0px; }
  #side { width:400px; flex:none; border-right:1px solid var(--border); order:-1; }
  nav.tabs, .sheet, .mob { display:none !important; }
  .fab { bottom:20px; right:20px; }
  .topbar { left:16px; right:auto; width:min(520px, calc(100% - 32px)); }
  .chips { top:86px; left:16px; }
  .tl { left:16px; right:auto; width:min(560px, calc(100% - 32px)); bottom:16px; border-radius:22px; border:1px solid var(--border); padding-bottom:16px; }
  .deskTabs { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 14px; }
  .deskTabs button { min-height:36px; padding:0 12px; border-radius:18px; border:1px solid var(--border); background:transparent; font-size:13px; font-weight:600; }
  .deskTabs button[aria-current="page"] { background:var(--accent); color:#12150F; border-color:var(--accent); font-weight:800; }
}
@media (max-width: 899px) { .deskTabs { display:none; } }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
// ───────────────────────── base ─────────────────────────
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname.replace(/[^/]*$/, "");
const params = new URLSearchParams(location.search);
const store = { get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let KEY = params.get("k") || store.get("pzmap_key");
const q = (p) => BASE + p + (KEY ? (p.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(KEY) : "");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const send = (method, p, body) => fetch(q(p), { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined })
  .then(async (r) => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status); return r.json(); });
const ago = (t, now = Date.now() / 1000) => { const s = Math.max(0, Math.round(now - t));
  return s < 60 ? `hace ${s} s` : s < 3600 ? `hace ${Math.round(s / 60)} min` : s < 86400 ? `hace ${Math.round(s / 3600)} h` : `hace ${Math.round(s / 86400)} d`; };
const hhmm = (h, m) => `${String(h ?? 0).padStart(2, "0")}:${String(m ?? 0).padStart(2, "0")}`;
const icon = (n) => `<svg class="ico"><use href="#i-${n}"/></svg>`;

let ME = store.get("pzmap_me");
let S = { players: [], events: [], marks: [], tasks: [], pings: [], world: {}, now: Date.now() / 1000 };
let FEATURES = true;

// colores: tú en ámbar, el resto con una paleta fija según el nombre
const PALETTE = ["#6CC4B6", "#9DB4F0", "#E9A0D2", "#C3E05A", "#B9A2F2", "#7FD1E8", "#F2E28C"];
const KNOWN = new Set();   // todos los nombres vistos: el orden alfabético decide el color (estable)
const colorOf = (n) => {
  n = String(n || ""); if (ME && n.toLowerCase() === ME.toLowerCase()) return "#E8A33D";
  if (n) KNOWN.add(n);
  const others = [...KNOWN].filter((x) => !ME || x.toLowerCase() !== ME.toLowerCase()).sort((a, b) => a.localeCompare(b));
  return PALETTE[Math.max(0, others.indexOf(n)) % PALETTE.length];
};
const meP = () => S.players.find((p) => ME && p.name.toLowerCase() === ME.toLowerCase());

// ───────────────────────── mapa ─────────────────────────
const WORLD = { w: 20000, h: 16000 };
const P = { x0: 0, y0: 0, sqr: 1, iso: false, scale: 1 };
const ll = (x, y) => P.iso
  ? L.latLng(-(P.y0 + (x + y) * P.sqr / 4) / P.scale, (P.x0 + (x - y) * P.sqr / 2) / P.scale)
  : L.latLng(-(P.y0 + y * P.sqr) / P.scale, (P.x0 + x * P.sqr) / P.scale);
const unll = (latlng) => {
  const px = latlng.lng * P.scale - P.x0, py = -latlng.lat * P.scale - P.y0;
  if (!P.iso) return [px / P.sqr, py / P.sqr];
  const a = px / (P.sqr / 2), b = py / (P.sqr / 4);
  return [(a + b) / 2, (b - a) / 2];
};
const map = L.map("map", { crs: L.CRS.Simple, minZoom: -6, maxZoom: 3, zoomSnap: 0.25, attributionControl: false, zoomControl: false });
const near = () => Math.max(map.getZoom(), map.getMaxZoom() - 2);

async function addDzi(root) {
  const [info, xml] = await Promise.all([fetch(root + "map_info.json").then((r) => r.json()), fetch(root + "layer0.dzi").then((r) => r.text())]);
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const img = doc.querySelector("Image"), size = doc.querySelector("Size");
  const W = +size.getAttribute("Width"), H = +size.getAttribute("Height");
  const ts = +img.getAttribute("TileSize"), fmt = img.getAttribute("Format");
  const maxLevel = Math.ceil(Math.log2(Math.max(W, H)));
  const sqr = +info.sqr || 1;
  Object.assign(P, { x0: +info.x0 || 0, y0: +info.y0 || 0, sqr, iso: sqr >= 64, scale: 2 ** (+info.skip || 0) });
  const maxZ = P.iso ? 1 : Math.max(1, Math.min(4, Math.round(Math.log2(16 * P.scale / sqr))));
  const minZ = -(maxLevel - 8);
  const Dzi = L.TileLayer.extend({ getTileUrl(c) { return `${root}layer0_files/${maxLevel + c.z}/${c.x}_${c.y}.${fmt}`; } });
  const bounds = L.latLngBounds([L.latLng(0, 0), L.latLng(-H, W)]);
  new Dzi("", { tileSize: ts, noWrap: true, bounds, minZoom: minZ, maxZoom: maxZ, minNativeZoom: minZ, maxNativeZoom: 0,
                keepBuffer: 1, updateWhenIdle: true }).addTo(map);
  map.setMinZoom(minZ); map.setMaxZoom(maxZ); map.setMaxBounds(bounds.pad(0.25)); map.fitBounds(bounds);
}

const Grid = L.GridLayer.extend({
  createTile(c) {
    const t = document.createElement("canvas"), s = this.getTileSize(); t.width = s.x; t.height = s.y;
    const g = t.getContext("2d"), z = Math.pow(2, c.z), x0 = c.x * s.x / z, y0 = c.y * s.y / z, span = s.x / z;
    g.fillStyle = "#2F3A27"; g.fillRect(0, 0, s.x, s.y);
    const step = z >= 0.06 ? 300 : 1500;
    g.strokeStyle = "rgba(236,233,221,.10)"; g.beginPath();
    for (let x = Math.ceil(x0 / step) * step; x <= x0 + span; x += step) { const px = (x - x0) * z; g.moveTo(px, 0); g.lineTo(px, s.y); }
    for (let y = Math.ceil(y0 / step) * step; y <= y0 + span; y += step) { const py = (y - y0) * z; g.moveTo(0, py); g.lineTo(s.x, py); }
    g.stroke(); return t;
  }
});

// ── niebla de guerra: oscuro donde nadie ha estado ──
let explored = new Set(), CELL = 20, KEYW = 4096, fogOn = store.get("pzmap_fog", "1") === "1";
const Fog = L.GridLayer.extend({
  createTile(c) {
    const t = document.createElement("canvas"), s = this.getTileSize(); t.width = s.x; t.height = s.y;
    const g = t.getContext("2d");
    g.fillStyle = "rgba(11,13,9,.84)"; g.fillRect(0, 0, s.x, s.y);
    if (!explored.size) return t;
    const nw = L.point(c.x * s.x, c.y * s.y);
    const corners = [[0, 0], [s.x, 0], [0, s.y], [s.x, s.y]].map(([dx, dy]) => unll(map.unproject(nw.add([dx, dy]), c.z)));
    const xs = corners.map((p) => p[0] / CELL), ys = corners.map((p) => p[1] / CELL);
    const px = (x, y) => map.project(ll(x, y), c.z).subtract(nw);
    const cellPx = map.project(ll(CELL, 0), c.z).distanceTo(map.project(ll(0, 0), c.z));
    const blur = Math.max(3, Math.min(36, cellPx * 1.1)), pad = Math.ceil(blur * 2 / Math.max(cellPx, 1)) + 1;
    const cx0 = Math.floor(Math.min(...xs)) - pad, cx1 = Math.ceil(Math.max(...xs)) + pad;
    const cy0 = Math.floor(Math.min(...ys)) - pad, cy1 = Math.ceil(Math.max(...ys)) + pad;
    g.globalCompositeOperation = "destination-out";
    if ("filter" in g) g.filter = `blur(${blur}px)`;
    g.fillStyle = "#000"; g.beginPath();
    const draw = (cx, cy) => {
      const a = px(cx * CELL - 4, cy * CELL - 4), b = px((cx + 1) * CELL + 4, cy * CELL - 4),
            d = px((cx + 1) * CELL + 4, (cy + 1) * CELL + 4), e = px(cx * CELL - 4, (cy + 1) * CELL + 4);
      g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.lineTo(d.x, d.y); g.lineTo(e.x, e.y); g.closePath();
    };
    const area = (cx1 - cx0 + 1) * (cy1 - cy0 + 1);
    if (area < explored.size) {
      for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) if (explored.has(cy * KEYW + cx)) draw(cx, cy);
    } else {
      for (const k of explored) { const cx = k % KEYW, cy = Math.floor(k / KEYW);
        if (cx >= cx0 && cx <= cx1 && cy >= cy0 && cy <= cy1) draw(cx, cy); }
    }
    g.fill(); return t;
  }
});
map.createPane("fog").style.zIndex = 350;   // encima del mapa, debajo de recorridos y marcadores
const fog = new Fog({ tileSize: 512, pane: "fog", updateWhenIdle: true, keepBuffer: 1 });
let fogTimer = null;
const refreshFog = () => { if (fogTimer) return; fogTimer = setTimeout(() => { fogTimer = null; if (fogOn) fog.redraw(); }, 4000); };
function setFog(on) {
  fogOn = on; store.set("pzmap_fog", on ? "1" : "0");
  $("fogOn").setAttribute("aria-pressed", on); $("fogOff").setAttribute("aria-pressed", !on);
  on ? fog.addTo(map) : fog.remove();
}
$("fogOn").onclick = () => setFog(true);
$("fogOff").onclick = () => setFog(false);
const km2 = (n) => (n * CELL * CELL / 1e6).toLocaleString("es", { maximumFractionDigits: n * CELL * CELL < 1e6 ? 2 : 1 });

// ── recorridos: solo el de quien sigues, o todos si los activas. Suaves y redondeados. ──
let trailsAll = false, follow = store.get("pzmap_follow");
const markers = {}, trails = {};
function smooth(pts) {               // Chaikin: esquinas redondeadas
  for (let it = 0; it < 2 && pts.length > 2; it++) {
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      out.push([ax * 0.75 + bx * 0.25, ay * 0.75 + by * 0.25], [ax * 0.25 + bx * 0.75, ay * 0.25 + by * 0.75]);
    }
    out.push(pts[pts.length - 1]); pts = out;
  }
  return pts;
}
function trailFor(p) {
  const col = colorOf(p.name);
  const pts = smooth((p.trail || []).map(([x, y]) => [x, y])).map(([x, y]) => ll(x, y));
  let t = trails[p.name];
  if (!t) t = trails[p.name] = {
    glow: L.polyline([], { color: col, weight: 12, opacity: 0.14, lineCap: "round", lineJoin: "round", smoothFactor: 1.5, interactive: false }),
    line: L.polyline([], { color: col, weight: 4, opacity: 0.85, lineCap: "round", lineJoin: "round", smoothFactor: 1.5, interactive: false }) };
  t.glow.setLatLngs(pts); t.line.setLatLngs(pts); t.glow.setStyle({ color: col }); t.line.setStyle({ color: col });
  const show = !TL.on && (trailsAll || follow === p.name);
  for (const l of [t.glow, t.line]) show ? l.addTo(map) : l.remove();
}
$("btnTrails").onclick = () => { trailsAll = !trailsAll; $("btnTrails").setAttribute("aria-pressed", trailsAll); S.players.forEach(trailFor); };
function setFollow(name) {
  follow = name || ""; store.set("pzmap_follow", follow);
  $("btnFollow").setAttribute("aria-pressed", !!follow);
  const p = S.players.find((x) => x.name === follow);
  if (p) map.flyTo(ll(p.x, p.y), near());
  if (follow && navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {});
  renderPlayers();
}
$("btnFollow").onclick = () => {
  if (follow) return setFollow("");
  const me = meP() || S.players.find((p) => p.online);
  if (me) setFollow(me.name);
};
map.on("dragstart", () => { if (follow) { follow = ""; store.set("pzmap_follow", ""); $("btnFollow").setAttribute("aria-pressed", false); renderPlayers(); } });

// ── marcadores de jugadores ──
function pinHtml(p) {
  const cls = "pin" + (p.online ? "" : " off") + (p.dead ? " dead" : "");
  const inner = p.dead ? "✕" : esc((p.name[0] || "?").toUpperCase());
  const label = follow === p.name ? `<div class="pinlabel">${esc(p.name)}</div>` : "";
  return `<div style="position:relative"><div class="${cls}" style="background:${colorOf(p.name)}">${inner}</div>${label}</div>`;
}
function placeMarkers() {
  const seen = new Set();
  for (const p of S.players) {
    seen.add(p.name);
    const ic = L.divIcon({ className: "", html: pinHtml(p), iconSize: [36, 36], iconAnchor: [18, 18] });
    if (!markers[p.name]) markers[p.name] = L.marker(ll(p.x, p.y), { icon: ic, zIndexOffset: 1000, keyboard: false })
      .on("click", () => setFollow(p.name)).addTo(map);
    else { markers[p.name].setLatLng(ll(p.x, p.y)); markers[p.name].setIcon(ic); }
    markers[p.name].bindTooltip(`${esc(p.name)} · ${p.dead ? "murió" : Math.round(p.hp) + " vida"}${p.vehicle ? " · " + esc(p.vehicle.name || "vehículo") : ""}`, { direction: "top", offset: [0, -20] });
    TL.on ? markers[p.name].remove() : markers[p.name].addTo(map);
    trailFor(p);
    if (follow === p.name && p.online && !TL.on) map.panTo(ll(p.x, p.y), { animate: true });
  }
  for (const n of Object.keys(markers)) if (!seen.has(n)) { markers[n].remove(); delete markers[n]; }
}

// ── marcas compartidas ──
const KIND = { base: ["Base", "home"], loot: ["Loot", "box"], peligro: ["Peligro", "alert"], carro: ["Carro", "car"], otro: ["Otro", "dot"] };
const markLayer = L.layerGroup().addTo(map);
function renderMarks() {
  markLayer.clearLayers();
  for (const m of S.marks) {
    const [label, ic] = KIND[m.kind] || KIND.otro;
    const html = `<div class="mark ${esc(m.kind)}"><span><svg><use href="#i-${ic}"/></svg></span>${esc(m.label || label)}</div>`;
    L.marker(ll(m.x, m.y), { icon: L.divIcon({ className: "", html, iconSize: [0, 0] }), zIndexOffset: 500 })
      .on("click", () => markModal(m)).addTo(markLayer);
  }
}

// ── pings ──
const pingLayer = L.layerGroup().addTo(map);
const DIRS = ["E", "NE", "N", "NO", "O", "SO", "S", "SE"];
function rel(x, y) {
  const me = meP(); if (!me || !me.online) return "";
  const dx = x - me.x, dy = y - me.y, d = Math.round(Math.hypot(dx, dy));
  if (d < 8) return "aquí cerca";
  const i = Math.round(Math.atan2(-dy, dx) / (2 * Math.PI) * 8 + 8) % 8;
  return `${d} m al ${DIRS[i]}`;
}
function renderPings() {
  pingLayer.clearLayers();
  for (const p of S.pings) {
    const r = rel(p.x, p.y);
    const html = `<div class="ping"><div class="ring"></div><div class="bubble"><b>${esc(p.from)} marcó aquí</b><br>${[r, ago(p.t, S.now)].filter(Boolean).join(" · ")}${p.text ? " · " + esc(p.text) : ""}</div></div>`;
    L.marker(ll(p.x, p.y), { icon: L.divIcon({ className: "", html, iconSize: [0, 0] }), interactive: false, zIndexOffset: 2000 }).addTo(pingLayer);
  }
}

// ── tocar el mapa: ping o marca ──
let armed = "";
function arm(mode) {
  armed = mode;
  $("banner").classList.toggle("hidden", !mode);
  $("bannerTxt").textContent = mode === "ping" ? "Toca el mapa para hacer ping" : "Toca el mapa donde va la marca";
  $("fab").classList.toggle("armed", mode === "ping");
  $("btnMark").setAttribute("aria-pressed", mode === "mark");
  if (mode && innerWidth < 900) setTab("mapa");
}
$("fab").onclick = () => arm(armed === "ping" ? "" : "ping");
$("btnMark").onclick = () => arm(armed === "mark" ? "" : "mark");
$("bannerCancel").onclick = () => arm("");
map.on("click", (e) => {
  if (!armed) return;
  const [x, y] = unll(e.latlng), mode = armed; arm("");
  ensureMe(() => {
    if (mode === "ping") send("POST", "api/ping", { x, y, by: ME }).catch(toast);
    else markModal({ x: Math.round(x), y: Math.round(y), kind: "base", label: "" }, true);
  });
});

function modal(html, cls = "") {
  $("modal").innerHTML = `<div class="modal ${cls}" id="mbg"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`;
  $("mbg").onclick = (e) => { if (e.target.id === "mbg") closeModal(); };
  const f = $("modal").querySelector("input, button"); if (f) setTimeout(() => f.focus(), 30);
}
const closeModal = () => { $("modal").innerHTML = ""; };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); arm(""); } });
function toast(err) { modal(`<h3>Ups</h3><div>${esc(err.message || err)}</div><div class="acts"><button class="btn" onclick="closeModal()">Ok</button></div>`); }

function ensureMe(then) {
  if (ME) return then();
  const names = [...new Set(S.players.map((p) => p.name))];
  modal(`<h3>¿Quién eres?</h3><div class="muted">Para firmar tus pings, marcas y tareas. Se guarda en este navegador.</div>
    ${names.length ? `<div class="kinds">${names.map((n) => `<button type="button" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
    <label for="meIn" class="sr">Tu nombre</label><input type="text" id="meIn" maxlength="40" placeholder="Tu nombre en el juego">
    <div class="acts"><button class="btn" id="meOk">Listo</button></div>`);
  const done = (n) => { n = (n || "").trim(); if (!n) return; ME = n; store.set("pzmap_me", n); closeModal(); renderAll(); then(); };
  $("modal").querySelectorAll("[data-n]").forEach((b) => b.onclick = () => done(b.dataset.n));
  $("meOk").onclick = () => done($("meIn").value);
  $("meIn").onkeydown = (e) => { if (e.key === "Enter") done($("meIn").value); };
}

function quickModal(x, y) {
  modal(`<h3>Este punto</h3><div class="muted">x ${Math.round(x)}, y ${Math.round(y)}</div>
    <div class="acts" style="justify-content:stretch"><button class="btn" id="qPing" style="flex:1">${icon("target")} Ping aquí</button>
    <button class="btn ghost" id="qMark" style="flex:1">${icon("pin")} Marcar aquí</button></div>`);
  $("qPing").onclick = () => { closeModal(); send("POST", "api/ping", { x, y, by: ME }).catch(toast); };
  $("qMark").onclick = () => markModal({ x: Math.round(x), y: Math.round(y), kind: "base", label: "" }, true);
}

function markModal(m, isNew = false) {
  let kind = m.kind || "otro";
  modal(`<h3>${isNew ? "Nueva marca" : "Marca"}</h3>
    ${isNew ? "" : `<div class="muted">De ${esc(m.by)} · ${ago(m.t, S.now)}</div>`}
    <div class="kinds" id="mk">${Object.entries(KIND).map(([k, [lab, ic]]) => `<button type="button" data-k="${k}" aria-pressed="${k === kind}">${icon(ic)} ${lab}</button>`).join("")}</div>
    <label for="mLabel" class="sr">Nombre de la marca</label><input type="text" id="mLabel" maxlength="40" placeholder="Nombre (opcional)" value="${esc(m.label)}">
    <div class="acts">${isNew ? "" : `<button class="btn ghost" id="mDel">Borrar</button>`}<button class="btn ghost" id="mNo">Cancelar</button><button class="btn" id="mOk">Guardar</button></div>`);
  $("modal").querySelectorAll("[data-k]").forEach((b) => b.onclick = () => {
    kind = b.dataset.k; $("modal").querySelectorAll("[data-k]").forEach((x) => x.setAttribute("aria-pressed", x === b)); });

}

// ── timelapse ──
const TL = { on: false, rows: [], events: [], i: 0, speed: 8, timer: null, layers: L.layerGroup() };
async function openTl() {
  if (innerWidth < 900) setTab("mapa");
  const h = await fetch(q("api/history")).then((r) => r.json()).catch(() => ({ rows: [], events: [] }));
  TL.rows = h.rows; TL.events = h.events.slice().sort((a, b) => a.t - b.t);
  if (!TL.rows.length) return toast("Todavía no hay recorridos guardados. Jueguen un rato y vuelvan.");
  TL.on = true; $("tl").classList.remove("hidden"); $("btnTl").setAttribute("aria-pressed", true);
  document.querySelectorAll(".sheet, .fab, #fogChips").forEach((e) => e.classList.add("hidden"));
  $("tlRange").max = TL.rows.length - 1; TL.i = 0; TL.layers.addTo(map); placeMarkers(); markLayer.remove(); pingLayer.remove();
  const pts = TL.rows.map((r) => ll(r[2], r[3])); map.fitBounds(L.latLngBounds(pts).pad(0.2));
  drawTl(); playTl(true);
}
function closeTl() {
  playTl(false); TL.on = false; TL.layers.clearLayers(); TL.layers.remove();
  $("tl").classList.add("hidden"); $("btnTl").setAttribute("aria-pressed", false);
  document.querySelectorAll(".sheet, .fab, #fogChips").forEach((e) => e.classList.remove("hidden"));
  markLayer.addTo(map); pingLayer.addTo(map); placeMarkers();
}
function drawTl() {
  TL.layers.clearLayers();
  const upto = TL.rows.slice(0, TL.i + 1), byName = {};
  for (const r of upto) (byName[r[1]] ||= []).push([r[2], r[3]]);
  for (const [n, pts] of Object.entries(byName)) {
    const col = colorOf(n), lat = smooth(pts).map(([x, y]) => ll(x, y));
    L.polyline(lat, { color: col, weight: 10, opacity: 0.14, lineCap: "round", lineJoin: "round", interactive: false }).addTo(TL.layers);
    L.polyline(lat, { color: col, weight: 4, opacity: 0.9, lineCap: "round", lineJoin: "round", interactive: false }).addTo(TL.layers);
    const [x, y] = pts[pts.length - 1];
    L.circleMarker(ll(x, y), { radius: 9, color: "#12150F", weight: 3, fillColor: col, fillOpacity: 1 }).bindTooltip(esc(n), { permanent: true, direction: "right", offset: [10, 0], className: "tip" }).addTo(TL.layers);
  }
  const r = TL.rows[TL.i];
  $("tlDay").innerHTML = `DÍA ${r[4] ?? "?"} <span class="muted">/ ${TL.rows[TL.rows.length - 1][4] ?? "?"}</span>`;
  $("tlRange").value = TL.i;
  let ev = null; for (const e of TL.events) { if (e.t <= r[0]) ev = e; else break; }
  $("tlCap").innerHTML = ev ? `<span class="muted">Día ${ev.day ?? "?"} · ${hhmm(ev.hour, ev.minute)} —</span> ${esc(ev.text)}` : `<span class="muted">Día ${r[4] ?? "?"} · ${hhmm(r[5], r[6])}</span>`;
}
function playTl(on) {
  clearInterval(TL.timer); TL.timer = null;
  $("tlPlay").innerHTML = `<svg class="ico" style="width:24px;height:24px"><use href="#i-${on ? "pause" : "play"}"/></svg>`;
  $("tlPlay").setAttribute("aria-label", on ? "Pausar" : "Reproducir");
  if (!on) return;
  if (TL.i >= TL.rows.length - 1) TL.i = 0;
  const step = Math.max(1, Math.round(TL.rows.length / 1200 * TL.speed));   // x1 ≈ 2 min, x8 ≈ 15 s
  TL.timer = setInterval(() => { TL.i = Math.min(TL.rows.length - 1, TL.i + step); drawTl(); if (TL.i >= TL.rows.length - 1) playTl(false); }, 100);
}
$("btnTl").onclick = () => TL.on ? closeTl() : openTl();
$("openTl").onclick = openTl;
$("tlClose").onclick = closeTl;
$("tlPlay").onclick = () => playTl(!TL.timer);
$("tlRange").oninput = (e) => { playTl(false); TL.i = +e.target.value; drawTl(); };
document.querySelectorAll("[data-speed]").forEach((b) => b.onclick = () => {
  TL.speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  if (TL.timer) playTl(true);
});

// ───────────────────────── conexión ─────────────────────────
let fitted = false, lastPhotos = -1;
function onState(s) {
  S = s;
  for (const k of s.new_cells || []) explored.add(k);
  if ((s.new_cells || []).length) refreshFog();
  renderAll();
  if (!fitted && s.players.some((p) => p.online)) {
    fitted = true;
    const f = s.players.find((p) => p.name === follow) || meP() || s.players.find((p) => p.online);
    if (f) map.setView(ll(f.x, f.y), near());
  }
  if (FEATURES && s.photos_n !== lastPhotos) { lastPhotos = s.photos_n; loadPhotos(); }
}
function setLive(ok) { $("live").classList.toggle("off", !ok); $("liveTxt").textContent = ok ? "EN VIVO" : "RECONECTANDO"; }
function connect() {
  const es = new EventSource(q("api/stream"));
  es.onmessage = (e) => { setLive(true); onState(JSON.parse(e.data)); };
  es.onerror = () => setLive(false);
  fetch(q("api/state")).then((r) => {
    if (r.status === 403) { es.close(); store.set("pzmap_key", ""); KEY = ""; showGate(); }
  });
  if (FEATURES) fetch(q("api/explored")).then((r) => r.json()).then((d) => {
    CELL = d.cell || 20; KEYW = d.keyw || 4096; for (const k of d.cells) explored.add(k); fog.redraw(); renderTop();
  }).catch(() => {});
  setInterval(() => { S.now = Date.now() / 1000; renderPings(); renderTop(); }, 10000);
}
function showGate() {
  modal(`<h3>Llave de acceso</h3><div class="muted">Pídela al que montó el mapa.</div>
    <label for="keyIn" class="sr">Llave</label><input type="text" id="keyIn" autocomplete="off" placeholder="Llave">
    <div class="acts"><button class="btn" id="keyOk">Entrar</button></div>`);
  $("keyOk").onclick = () => { KEY = $("keyIn").value.trim(); store.set("pzmap_key", KEY); closeModal(); connect(); };
}

async function boot() {
  const cfg = await fetch(BASE + "config.json").then((r) => r.json()).catch(() => ({}));
  FEATURES = cfg.features !== false;
  document.title = cfg.title || "PZ Live Map";
  buildTabs(); setTab(innerWidth >= 900 ? "grupo" : "mapa");
  if (!FEATURES) document.querySelectorAll("#fab, #btnMark, #btnTl, #fogChips").forEach((e) => e.classList.add("hidden"));
  let hasDzi = false;
  if (cfg.dzi) { try { await addDzi(BASE + cfg.dzi); hasDzi = true; } catch (e) { console.warn("DZI", e); } }
  if (!hasDzi) {
    map.fitBounds([ll(0, 0), ll(WORLD.w, WORLD.h)]);
    if (cfg.tiles) L.tileLayer(cfg.tiles, { noWrap: true, minZoom: -6, maxZoom: 3 }).addTo(map);
    else new Grid({ tileSize: 256, noWrap: true }).addTo(map);
    const towns = await fetch(BASE + "towns.json").then((r) => r.json()).catch(() => []);
    for (const t of towns) L.marker(ll(t.x, t.y), { interactive: false, icon: L.divIcon({ className: "", html: `<div class="town">${esc(t.name)}</div>` }) }).addTo(map);
  }
  if (cfg.image && cfg.image_bounds) { const [x0, y0, x1, y1] = cfg.image_bounds; L.imageOverlay(BASE + "map.png", [ll(x0, y0), ll(x1, y1)], { opacity: 0.9 }).addTo(map); }
  if (FEATURES) setFog(fogOn);
  $("btnFollow").setAttribute("aria-pressed", !!follow);
  if (cfg.need_key && !KEY) return showGate();
  connect();
}
boot();
</script>
</body>
